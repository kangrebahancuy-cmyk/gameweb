name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Requires a committed package-lock.json (generate with `npm install` locally and commit it).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The production build needs the third-party art, which is not stored in Git; see docs/ASSET_CREDITS.md.
